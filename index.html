<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1B2E; --bg2:#10263F; --bg3:#163252; --line:#21405F;
  --text:#E8EFF5; --muted:#A3B6CA;
  --teal:#2EC4B6; --teal-d:#12857B; --emerald:#1FA67A; --emerald-d:#137450;
  --paper:#EEF1F2; --paper2:#E1E7EA; --ink:#15283D; --ink2:#4B5E73;
  --gold:#D9AE55; --gold2:#F1D38E; --gold-d:#9A7323;
  --warn:#B9770E; --bad:#C24D4D;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#0A1B2E; --bg2:#10263F; --text:#E8EFF5; color-scheme:dark; } }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:17px;line-height:1.8;color:var(--text);background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 90% -8%,rgba(46,196,182,.13),transparent 60%),linear-gradient(rgba(130,170,210,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(130,170,210,.045) 1px,transparent 1px);
  background-size:auto,34px 34px,34px 34px;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Reem Kufi','IBM Plex Sans Arabic',sans-serif;line-height:1.4;margin:0;font-weight:700}
p{margin:0 0 .8em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--teal)}

/* header */
.top{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);background:rgba(10,27,46,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-family:'Reem Kufi';font-weight:700;font-size:20px}
.brand svg{width:34px;height:34px;color:var(--teal)}
.nav{display:flex;gap:4px}
.nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:15px}
.nav a[aria-current="page"]{color:var(--text);background:var(--bg3)}
.nav a:hover{color:var(--text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-weight:600;font-size:16px;line-height:1.4;text-decoration:none;transition:background .2s,border-color .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--teal);color:#062A2A}
.btn-primary:hover:not(:disabled){background:#4ad6c9}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-gold{background:var(--gold);color:#2B1E04}
.btn-gold:hover{background:var(--gold2)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover:not(:disabled){background:#21405F}
.btn-line-ink{background:#fff;color:var(--ink);border:1.5px solid #C6D1DA}
.btn-line-ink:hover{border-color:var(--teal-d)}
.btn-danger{background:transparent;color:#F0A0A0;border:1.5px solid #6B3340}
.btn-danger:hover{background:#3A1E28}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:11px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:64px 0 60px}
.hero h1{font-size:clamp(42px,6.4vw,74px);line-height:1.15}
.hero .tag{color:var(--teal);font-size:clamp(17px,2vw,21px);font-weight:600;margin:14px 0 26px}
.hero .ask{font-family:'Reem Kufi';font-size:clamp(20px,2.4vw,26px);margin:0 0 10px;color:var(--gold2)}
.hero .lead{color:var(--muted);max-width:50ch;margin-bottom:26px}
.lens-stage{position:relative;transform:rotate(-1.5deg);--lx:50%;--ly:50%;--lr:64px}
.lens-doc{position:relative;background:var(--paper);color:var(--ink);border-radius:18px;padding:30px 28px 26px;box-shadow:0 34px 70px -24px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
.lens-doc .doc-h{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #CBD5DC;padding-bottom:10px;margin-bottom:14px;font-family:'Reem Kufi';font-size:18px}
.lens-doc .doc-stamp{border:2.5px solid var(--bad);color:var(--bad);border-radius:8px;padding:0 10px;transform:rotate(-7deg);font-size:15px}
.lens-doc ul{list-style:none;margin:0;padding:0}
.lens-doc li{padding:7px 0;border-bottom:1px dashed #CBD5DC;font-size:16px}
.lens-doc li:last-child{border:0;font-weight:600}
.lens-doc .blur{filter:blur(3.2px);opacity:.55}
.lens-doc .clear{position:absolute;inset:0;padding:30px 28px 26px;background:var(--paper);border-radius:18px;clip-path:circle(var(--lr) at var(--lx) var(--ly));-webkit-clip-path:circle(var(--lr) at var(--lx) var(--ly))}
.lens-doc .clear mark{background:rgba(46,196,182,.28);color:var(--ink);border-radius:4px;padding:0 3px}
.lens-ring{position:absolute;left:var(--lx);top:var(--ly);width:calc(var(--lr)*2 + 12px);height:calc(var(--lr)*2 + 12px);transform:translate(-50%,-50%);border-radius:50%;border:7px solid var(--gold);box-shadow:inset 0 0 22px rgba(255,255,255,.6),0 10px 24px rgba(0,0,0,.35);pointer-events:none}
.lens-ring::after{content:"";position:absolute;width:15px;height:62px;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:8px;left:calc(85% - 4px);top:calc(85% - 4px);transform:rotate(-45deg);transform-origin:top center}

/* sections */
.sec{padding:34px 0}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-size:28px}
.sec-h p{color:var(--muted);margin:0}

/* id card */
.idcard{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:26px}
.idcard h2{font-size:22px;margin-bottom:6px}
.idcard .note{color:var(--muted);font-size:14px;margin:0 0 14px}
.login{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:end}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.login input,.tlogin input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);min-width:0;width:100%}
.login input:focus,.tlogin input:focus{border-color:var(--teal);outline:none}
.who{font-size:18px;margin:0 0 4px}
.gate{display:flex;justify-content:center;padding-top:40px;padding-bottom:40px}
.gate-card{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:32px 28px;text-align:center}
.gate-ic{width:64px;height:64px;margin:0 auto 8px;color:var(--teal)}
.gate-ic svg{width:100%;height:100%}
.gate-card h1{font-size:clamp(30px,6vw,40px)}
.gate-tag{color:var(--teal);font-weight:600;margin:6px 0 10px}
.gate-note{color:var(--muted);font-size:15.5px;max-width:42ch;margin:0 auto 18px}
.gate-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:right}
.gate-form label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.gate-form label:first-child,.gate-form .btn{grid-column:1 / -1}
.gate-form input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);min-width:0;width:100%;font-size:16px}
.gate-form input:focus{border-color:var(--teal);outline:none}
.gate-form .btn{margin-top:4px;padding:14px}
.gate-msg{color:var(--gold2);min-height:1.5em;margin:12px 0 0;font-size:15px}
.gate-help{text-align:right;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;font-size:14px;color:var(--muted)}
.gate-help p{margin:0 0 6px}
.gate-help b{color:var(--text)}
.sync{font-size:14px;color:var(--teal);margin:0}
.sync[data-s="offline"],.sync[data-s="auth"]{color:var(--gold2)}
.tlogin{display:flex;gap:8px;flex-wrap:wrap;max-width:420px;margin-top:12px}
.tlogin input{flex:1;min-width:160px}
@media (max-width:600px){ .login{grid-template-columns:1fr 1fr} .login label:first-child,.login > .btn{grid-column:1 / -1} }
.name-in{display:flex;gap:8px;flex-wrap:wrap}
.name-in input{flex:1;min-width:180px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text)}
.name-in input:focus{border-color:var(--teal);outline:none}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.counter{background:var(--bg);border-radius:14px;padding:12px 14px}
.counter b{display:block;font-family:'Reem Kufi';font-size:30px;line-height:1.2;color:var(--gold2)}
.counter span{font-size:14px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:flex;gap:12px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.badge .bi{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:22px;background:var(--bg3);filter:grayscale(1);opacity:.5}
.badge b{display:block;font-size:15px}
.badge small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.badge.on{border-color:var(--gold)}
.badge.on .bi{filter:none;opacity:1;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 70%)}

/* folders */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.folder{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:18px 0 18px 18px;padding:24px 22px 22px;margin-top:30px;display:flex;flex-direction:column}
.folder .ftab{position:absolute;top:-31px;right:-1px;height:32px;padding:4px 16px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;font-size:14px;color:var(--muted)}
.folder .fic{width:58px;height:58px;color:var(--teal);margin-bottom:12px}
.folder h3{font-size:22px;margin-bottom:4px}
.folder .topic{color:var(--muted);font-size:15px;margin-bottom:14px}
.folder .fstatus{font-size:14px;margin-bottom:16px;color:var(--muted)}
.folder .fstatus b{color:var(--text)}
.folder .row{margin-top:auto}
.folder.solved{border-color:#4A5A3A}
.fstamp{position:absolute;left:18px;top:20px;border:2.5px solid var(--gold);color:var(--gold);border-radius:8px;padding:0 10px;transform:rotate(-9deg);font-family:'Reem Kufi';font-weight:700;font-size:15px}
.mini-bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--teal);border-radius:6px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.skill{display:flex;gap:12px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid var(--line)}
.skill .si{font-size:22px;line-height:1.3}
.skill b{display:block;font-size:16px}
.skill small{color:var(--muted);font-size:14px;line-height:1.6;display:block}

footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

/* case page */
.case-top{padding:26px 0 8px}
.back{background:none;border:0;color:var(--muted);padding:4px 0;font-size:15px}
.back:hover{color:var(--text)}
.case-title{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.case-title svg{width:46px;height:46px;color:var(--teal);flex:none}
.case-title h1{font-size:clamp(26px,4vw,36px)}
.case-title .cno{font-size:14px;color:var(--muted);display:block;font-family:'IBM Plex Sans Arabic';font-weight:500}
.stepper{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stepper button{width:100%;background:none;border:0;padding:0;text-align:right;color:var(--muted);font-size:13.5px;line-height:1.5}
.stepper button:disabled{cursor:default;opacity:.6}
.stepper .bar{display:block;height:6px;border-radius:6px;background:var(--bg3);margin-bottom:8px;overflow:hidden}
.stepper .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.stepper .done .bar i{width:100%}
.stepper .cur .bar i{width:50%;background:var(--gold)}
.stepper .cur{color:var(--text);font-weight:600}
.stepper .sn{font-family:'Reem Kufi';margin-left:4px}
.stage{padding:26px 0 30px}
.paper{background:var(--paper);color:var(--ink);border-radius:20px;padding:30px;box-shadow:0 20px 50px -30px rgba(0,0,0,.7)}
.paper + .paper{margin-top:18px}
.paper h2{font-size:24px;margin-bottom:12px}
.paper h3{font-size:19px;margin:0 0 8px}
.paper .muted{color:var(--ink2)}
.measure{max-width:70ch}
.story{display:grid;grid-template-columns:1fr 200px;gap:30px;align-items:start}
.story .art{color:var(--teal-d);background:var(--paper2);border-radius:18px;padding:22px;aspect-ratio:1}
.story .art svg{width:100%;height:100%}
.problem{border-right:5px solid var(--gold);background:#FFF;border-radius:12px;padding:14px 18px;margin:18px 0 6px}
.problem b{display:block;font-family:'Reem Kufi';color:var(--gold-d);font-size:15px;margin-bottom:2px}
.howto{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;color:var(--ink2);font-size:15px}
.howto li::before{content:"🔹";margin-left:6px}
.stage-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:22px}

/* evidence */
.ev{background:#fff;border-radius:16px;padding:20px 22px;margin:14px 0;border-right:5px solid var(--teal-d);scroll-margin-top:90px;transition:box-shadow .4s}
.ev.k-info{border-right-color:var(--emerald)}
.ev.k-data{border-right-color:var(--gold)}
.ev.k-quote{border-right-color:#8A8FB0}
.ev.k-place{border-right-color:#3A7CA5}
.ev.flash{box-shadow:0 0 0 4px rgba(217,174,85,.65)}
.ev-head{display:flex;gap:10px;align-items:center;margin-bottom:4px;font-size:13.5px}
.ev-no{font-family:'Reem Kufi';color:var(--ink)}
.ev-kind{background:var(--paper2);border-radius:999px;padding:1px 10px;color:var(--ink2)}
.ev h3{font-size:18px}
.ev p{max-width:72ch}
.term{background:rgba(46,196,182,.16);border:0;border-bottom:2px dotted var(--teal-d);color:inherit;padding:0 3px;border-radius:4px;font-weight:600;line-height:1.6}
.term:hover{background:rgba(46,196,182,.3)}
table.data{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px;background:#fff}
table.data th,table.data td{border:1px solid #D3DCE2;padding:8px 10px;text-align:center}
table.data th{background:var(--paper2);font-weight:600}
table.data td:first-child,table.data th:first-child{text-align:right}
.tscroll{overflow-x:auto}
figure.chartbox{margin:14px 0 4px;background:var(--paper);border-radius:14px;padding:12px 14px}
figure.chartbox figcaption{font-weight:600;font-size:15px;margin-bottom:4px}
svg.chart{width:100%;height:auto;max-width:520px;display:block;margin:0 auto;direction:ltr}
svg.chart .g{stroke:#D3DCE2;stroke-width:1}
svg.chart .ax{fill:#4B5E73;font-size:12px;font-family:'IBM Plex Sans Arabic',sans-serif}
svg.chart .val{fill:#15283D;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Arabic',sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:13.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:3px;vertical-align:middle;margin-left:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px)!important;height:3px}

/* questions */
.qtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{width:34px;height:34px;border-radius:50%;border:1.5px solid #C6D1DA;background:#fff;color:var(--ink2);font-size:14px;font-weight:600}
.qdot.cur{border-color:var(--ink);background:var(--ink);color:#fff}
.qdot.full{background:#DDF2E8;border-color:var(--emerald);color:var(--emerald-d)}
.qdot.part{background:#FBF0DC;border-color:var(--gold);color:var(--gold-d)}
.qdot:disabled{opacity:.5;cursor:default}
.skilltag{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;background:var(--paper2);border-radius:999px;padding:3px 12px;color:var(--ink2)}
.paper .qtext{font-size:19px;line-height:1.7;font-weight:600;margin:4px 0 14px;max-width:70ch}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:#fff;border:2px solid #D3DCE2;border-radius:14px;padding:13px 16px;margin:10px 0;color:var(--ink);line-height:1.7}
.opt:hover:not(:disabled){border-color:var(--teal-d)}
.opt-l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);font-weight:700;font-size:14px}
.opt.sel{border-color:var(--teal-d);background:#E5F6F4}
.opt.sel .opt-l{background:var(--teal-d);color:#fff}
.opt.right{border-color:var(--emerald);background:#E1F4EA}
.opt.right .opt-l{background:var(--emerald);color:#fff}
.opt.wrong{border-color:#E3B4B4;background:#FBEFEF;color:#6B4646}
.opt:disabled{cursor:default}
ol.ordlist{list-style:none;margin:0;padding:0}
.ord{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #D3DCE2;border-radius:12px;padding:10px 12px;margin:8px 0}
.ord-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.ord-t{flex:1;min-width:0;overflow-wrap:anywhere}
.ord-b{display:flex;gap:4px;flex:none}
.ord-b button{width:38px;height:38px;border-radius:10px;border:1.5px solid #C6D1DA;background:var(--paper);color:var(--ink);font-size:13px}
.ord-b button:disabled{opacity:.3}
.ord.ok,.crow.ok{border-color:var(--emerald);background:#EEF9F3}
.ord.no,.crow.no{border-color:#E2BC7A;background:#FDF6E9}
.crow{background:#fff;border:2px solid #D3DCE2;border-radius:14px;padding:12px 14px;margin:10px 0}
.crow p{margin:0 0 8px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #C6D1DA;background:#fff;border-radius:999px;padding:6px 14px;font-size:14.5px;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--teal-d)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{cursor:default}
.crow select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #C6D1DA;background:#fff;color:var(--ink);font-size:15px}
.fix{margin-top:8px;font-size:14.5px;color:var(--emerald-d);font-weight:600}
.fb{border-radius:14px;padding:14px 18px;margin-top:18px;font-size:16px}
.fb p:last-child{margin-bottom:0}
.fb b.h{display:block;font-family:'Reem Kufi';font-size:17px;margin-bottom:4px}
.fb.good{background:#DFF3E8;color:#0E4D36}
.fb.try{background:#FCF0DA;color:#6A4307}
.fb.info{background:#E4ECF3;color:var(--ink)}
.pts{display:inline-block;background:var(--gold);color:#2B1E04;border-radius:999px;padding:0 10px;font-weight:700;font-size:14px;margin-inline-start:6px}
.refbtn{background:#fff;border:1.5px solid currentColor;border-radius:999px;padding:2px 12px;font-size:14px;margin:4px 0 0 6px;color:inherit}
.correct-list{margin:6px 0 0;padding-right:22px}

/* room */
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.evcard{display:flex;gap:12px;width:100%;text-align:right;align-items:flex-start;background:#fff;border:2px solid #D3DCE2;border-radius:14px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.evcard .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #9FB0BF;display:grid;place-items:center;margin-top:3px;font-size:14px;color:#fff}
.evcard[aria-pressed="true"]{border-color:var(--teal-d);background:#E8F7F5}
.evcard[aria-pressed="true"] .box{background:var(--teal-d);border-color:var(--teal-d)}
.evcard small{display:block;color:var(--ink2);font-size:13px}
.evcard:disabled{cursor:default}
.evcard.r-ok{border-color:var(--emerald);background:#EEF9F3}
.evcard.r-miss{border-style:dashed;border-color:var(--emerald)}
.evcard.r-bad{border-color:#E2BC7A;background:#FDF6E9}

/* result */
.verdict{position:relative;overflow:hidden}
.solved-stamp{position:absolute;left:26px;top:22px;border:4px solid var(--gold-d);color:var(--gold-d);font-family:'Reem Kufi';font-size:22px;padding:4px 16px;border-radius:12px;transform:rotate(-10deg);background:rgba(255,255,255,.4)}
.solved-stamp.anim{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:rotate(-10deg) scale(2.4);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
.res-title{font-size:15px;color:var(--ink2);margin-bottom:2px}
.res-head h2{font-size:30px;margin-bottom:6px;padding-left:150px}
.scoreline{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.scoreline span{background:#fff;border-radius:12px;padding:8px 14px;font-size:14.5px}
.scoreline b{font-family:'Reem Kufi';font-size:18px}
.explain-box{background:#fff;border-radius:14px;padding:16px 20px;margin:12px 0;border-right:5px solid var(--emerald)}
.explain-box.alt{border-right-color:#C6D1DA}
.explain-box.lim{border-right-color:var(--gold);background:#FFFBF1}
.alt-list{list-style:none;padding:0;margin:0}
.alt-list li{padding:10px 0;border-bottom:1px solid var(--paper2)}
.alt-list li:last-child{border:0}
.alt-list b{display:block}
.skillbars{display:grid;gap:10px}
.sb{display:grid;grid-template-columns:minmax(150px,240px) 1fr 52px;gap:12px;align-items:center;font-size:14.5px}
.sb .track{height:10px;background:var(--paper2);border-radius:6px;overflow:hidden}
.sb .track i{display:block;height:100%;border-radius:6px;background:var(--teal-d)}
.sb .track i.lo{background:var(--gold)}
.sb b{text-align:left;font-size:14px}
.newbadges{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.newbadges span{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2B1E04;border-radius:999px;padding:6px 14px;font-weight:600}

/* certificate */
.cert-wrap{display:flex;justify-content:center}
.certgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.certcard{display:flex;flex-direction:column;gap:4px;background:var(--bg2);border:1.5px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted);text-decoration:none;min-height:150px}
.certcard b{color:var(--text);font-family:'Reem Kufi';font-size:17px;line-height:1.5}
.certcard small{font-size:13.5px;line-height:1.6}
.certcard .cc-ic{font-size:26px;line-height:1.2;filter:grayscale(1);opacity:.55}
.certcard.on{border-style:solid;border-color:var(--gold);transition:background .2s}
.certcard.on:hover{background:var(--bg3)}
.certcard.on .cc-ic{filter:none;opacity:1}
.certcard .cc-go{margin-top:auto;color:var(--gold2);font-weight:600;font-size:14px;padding-top:8px}
.grandcard{background:linear-gradient(160deg,var(--bg3),var(--bg2))}
.grandcard.on{border-width:2px;box-shadow:0 0 0 4px rgba(217,174,85,.12)}
.cc-bar{display:block;height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:auto}
.cc-bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.grand-note{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FFF6E0;border:1.5px solid var(--gold);border-radius:14px;padding:14px 18px;margin-top:14px}
.grand-note > span{font-size:30px}
.grand-note div{flex:1;min-width:200px}
.grand-note p{margin:0;font-size:15px;color:var(--ink2)}
.cert.grand .cert-in{border-width:4px;background:radial-gradient(ellipse at top,#FFF8E6,#fff 62%)}
.cert .c-ribbon{background:var(--gold);color:#2B1E04;font-family:'Reem Kufi';font-weight:700;border-radius:6px;padding:2px 18px;margin-top:1%;font-size:clamp(12px,1.6vw,16px)}
.cert .c-cases{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:1.5% 0 .5%;font-size:clamp(11px,1.5vw,14px)}
.cert .c-cases span{background:var(--paper);border-radius:8px;padding:3px 12px;color:var(--ink2)}
.cert .c-cases b{color:var(--ink);margin-left:6px;font-weight:600}
@media (max-width:900px){ .certgrid{grid-template-columns:1fr 1fr} }
@media (max-width:420px){ .certgrid{grid-template-columns:1fr} .certcard{min-height:0} }
.cert{width:100%;max-width:900px;aspect-ratio:1.414;background:#fff;color:var(--ink);border-radius:6px;padding:22px;position:relative;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.cert-in{height:100%;border:3px solid var(--gold);outline:1.5px solid var(--gold);outline-offset:-10px;border-radius:4px;padding:5% 7%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at top,#F4FBFA,#fff 60%)}
.cert .c-logo{display:flex;align-items:center;gap:8px;font-family:'Reem Kufi';font-size:clamp(14px,2vw,18px);color:var(--teal-d)}
.cert .c-logo svg{width:28px;height:28px}
.cert h2{font-size:clamp(24px,4.4vw,44px);color:var(--ink);margin:2% 0 1%}
.cert .c-sub{font-size:clamp(13px,1.8vw,17px);color:var(--ink2);margin:0}
.cert .c-name{font-family:'Reem Kufi';font-size:clamp(26px,5vw,50px);color:var(--gold-d);margin:1.5% 0;border-bottom:2px solid var(--paper2);padding:0 24px}
.cert .c-title{display:inline-block;background:var(--ink);color:var(--gold2);border-radius:999px;padding:4px 20px;font-family:'Reem Kufi';font-size:clamp(14px,2vw,20px);margin:1% 0}
.cert .c-skills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:1.5% 0;font-size:clamp(11px,1.5vw,14px)}
.cert .c-skills span{border:1.5px solid var(--teal-d);color:var(--teal-d);border-radius:999px;padding:1px 10px}
.cert .c-foot{display:flex;justify-content:space-between;width:100%;margin-top:auto;font-size:clamp(11px,1.5vw,14px);color:var(--ink2);align-items:end}
.cert .seal{width:clamp(56px,9vw,86px);height:clamp(56px,9vw,86px);border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 65%,var(--gold-d));display:grid;place-items:center;color:#2B1E04;font-family:'Reem Kufi';font-size:clamp(10px,1.4vw,13px);line-height:1.3;box-shadow:inset 0 0 0 4px rgba(255,255,255,.4)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(4,12,22,.6);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--paper);color:var(--ink);z-index:55;overflow:auto;padding:20px 22px 40px;transform:translateX(-102%);transition:transform .3s ease;box-shadow:20px 0 50px rgba(0,0,0,.4)}
.drawer.open{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-20px;background:var(--paper);padding:10px 0;z-index:2;border-bottom:1px solid #D3DCE2}
.drawer-h h2{font-size:20px}
.xbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid #C6D1DA;background:#fff;color:var(--ink);font-size:20px;line-height:1}
#modal .mbox{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));background:var(--paper);color:var(--ink);border-radius:20px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#modal .scrim{z-index:65}
#modal h3{font-size:20px;margin-bottom:8px}
.fab{position:fixed;bottom:18px;left:18px;z-index:35;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:80;font-size:15px;max-width:calc(100% - 32px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}

/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs button{background:var(--bg2);border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 16px;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--teal);color:#062A2A;border-color:var(--teal);font-weight:600}
.notice{background:var(--bg2);border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:14px;padding:14px 18px;color:var(--muted);font-size:15px}
.notice b{color:var(--text)}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.tstats div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.tstats b{display:block;font-family:'Reem Kufi';font-size:28px;color:var(--gold2)}
.tstats span{color:var(--muted);font-size:14px}
.ttable{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--bg2);border-radius:14px;overflow:hidden}
.ttable th,.ttable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}
.ttable th{color:var(--muted);font-weight:500;background:var(--bg3)}
.empty{text-align:center;padding:40px 20px;background:var(--bg2);border:1.5px dashed var(--line);border-radius:18px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
details.key{background:var(--paper);color:var(--ink);border-radius:16px;padding:6px 20px;margin:12px 0}
details.key summary{cursor:pointer;font-family:'Reem Kufi';font-size:19px;padding:12px 0}
details.key ol{padding-right:20px}
details.key li{margin-bottom:14px}
.kans{color:var(--emerald-d);font-weight:600}
.kexp{color:var(--ink2);font-size:14.5px}
.paper-dark .sb .track{background:var(--bg3)}
.paper-dark{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill-list span{border-radius:999px;padding:4px 12px;font-size:14px;background:var(--bg3)}
select.dark{background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:36px;padding:40px 0}
  .lens-stage{max-width:520px;--lr:52px}
  .cases{grid-template-columns:1fr;gap:6px}
  .skills{grid-template-columns:1fr 1fr}
  .idcard{grid-template-columns:1fr}
  .room-grid,.two{grid-template-columns:1fr}
  .story{grid-template-columns:1fr}
  .story .art{max-width:160px;order:-1;aspect-ratio:1}
}
@media (max-width:600px){
  body{font-size:16px}
  .paper{padding:20px 16px;border-radius:16px}
  .skills{grid-template-columns:1fr}
  .stepper{grid-template-columns:repeat(6,1fr);gap:4px}
  .stepper .lbl{display:none}
  .stepper .cur .lbl{display:none}
  .step-cur-label{display:block!important}
  .howto{grid-template-columns:1fr}
  .counters{grid-template-columns:repeat(3,1fr)}
  .counter b{font-size:24px}
  .badges{grid-template-columns:1fr}
  .res-head h2{padding-left:0;padding-top:56px;font-size:24px}
  .solved-stamp{font-size:17px;left:16px;top:16px}
  .sb{grid-template-columns:1fr 46px;}
  .sb .track{grid-column:1 / -1;order:3}
  .tstats{grid-template-columns:1fr 1fr 1fr}
  .tstats b{font-size:22px}
  .ttable{font-size:13px}
  .ttable th,.ttable td{padding:8px 6px}
  .nav{gap:0}
  .nav a{padding:6px 7px;font-size:13.5px;white-space:nowrap}
  .brand{gap:6px}
  .brand svg{width:26px;height:26px}
  .brand span{font-size:16px;white-space:nowrap}
  .top .wrap{padding:0 12px}
  .ev{padding:16px}
  .paper .qtext{font-size:17px}
}
.step-cur-label{display:none;font-size:14px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (max-width:700px){ .cert{aspect-ratio:auto;padding:12px} .cert-in{height:auto;padding:28px 18px 22px;gap:4px} .cert .c-name{padding:0 10px} .cert .c-foot{margin-top:18px} .cert h2{margin:8px 0 4px} }
@page{size:A4 landscape;margin:8mm}
#print-root{display:none}
@media print{
  html,body{background:#fff!important;overflow:visible!important}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .cert{width:100%;max-width:none;height:96vh;aspect-ratio:auto;box-shadow:none;border-radius:0;padding:0;margin:0;overflow:hidden;break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-root .cert-in{height:100%;padding:4% 6%;gap:0}
  #print-root .cert .c-name{font-size:40px}#print-root .cert h2{font-size:34px}#print-root .cert .c-sub{font-size:15px}#print-root .cert .c-title{font-size:18px}#print-root .cert .c-skills{font-size:12px}#print-root .cert .c-cases{font-size:12px}#print-root .cert .c-ribbon{font-size:14px}#print-root .cert .c-foot{font-size:12px}#print-root .cert .seal{width:76px;height:76px;font-size:11px}
}
@media print and (orientation:portrait){
  #print-root .cert-in{padding:10% 7%}
  #print-root .cert .c-name{font-size:36px}#print-root .cert h2{font-size:30px}
}
</style>

      <span>مُحقِّقة العلوم</span>
    </a>
    <nav class="nav" aria-label="التنقل الرئيسي">

async function rpc(fn, args){
  let r;
  try{
    r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(args)});
  }catch(e){ const er = new Error('offline'); er.code = 'offline'; throw er; }
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok){
    let code = (j && j.message) || ('http_' + r.status);
    if((j && j.code === 'PGRST202') || /Could not find the function/i.test(code)) code = 'not_setup';
    else if(r.status === 401 || /api key|JWT/i.test(code)) code = 'bad_key';
    const er = new Error(code); er.code = code; er.raw = j; throw er;
  }
  return j;
}

async function studentLogin(name, cls, pin){
  name = norm(name); cls = toEn(norm(cls)).slice(0, 30); pin = toEn(pin);
  if(!name) throw Object.assign(new Error(), {code:'invalid_name'});
  if(!/^[0-9]{4,8}$/.test(pin)) throw Object.assign(new Error(), {code:'invalid_pin'});
  const res = await rpc('mq_student_login', {p_name:name, p_class:cls, p_pin:pin});
  const remote = (res && res.state) || {};
  DB.session = {name, cls, pin};
  const k = skey(), local = DB.students[k], guest = DB.students[GUEST];
  const has = x => x && (Object.keys(x.best || {}).length || Object.keys(x.progress || {}).length);
  if(remote.updatedAt && (!local || (local.updatedAt || 0) <= remote.updatedAt)){
    DB.students[k] = {progress:remote.progress || {}, best:remote.best || {}, badges:remote.badges || [], updatedAt:remote.updatedAt};
  } else if(!local && !remote.updatedAt && has(guest)){
    DB.students[k] = guest; delete DB.students[GUEST];
    DB.attempts.filter(a => a.key === GUEST).forEach(a => { DB.pending.push(attemptArgs(a)); a.key = k; });
  } else if(!local){
    DB.students[k] = {progress:{}, best:{}, badges:[]};
  }
  me().updatedAt = me().updatedAt || Date.now();
  DB.current = '';
  localSave();
  await pushNow();
}

function newProgress(c){

    qs: c.questions.map(q => {
      const st = {att:0, earned:0, done:false, sel:null, f1:0, marks:null, wrong1:null};
      if(q.type === 'order') st.sel = shuffleNotIdentity(q.items.length);
      if(q.type === 'classify' || q.type === 'match') st.sel = q.items.map(() => null);

    }),

function shuffleNotIdentity(n){
  let a;
  do{ a = [...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } }
  while(a.filter((v,i)=>v===i).length > 1);
  return a;
}

function chartHTML(ch){
  const W=380, H=240, pl=42, pr=18, pt=18, pb=38, iw=W-pl-pr, ih=H-pt-pb;
  const min = ch.min || 0, max = ch.max;
  const y = v => pt + ih - ((v-min)/(max-min))*ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch.title)}">`;
  for(let v=min; v<=max; v+=ch.step){
    s += `<line class="g" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${ar(v)}</text>`;
  }
  let legend = '';
  if(ch.type === 'bar'){
    const bw = 72, gap = (iw - ch.bars.length*bw)/(ch.bars.length+1);
    ch.bars.forEach((b,i) => {
      const x = pl + gap + (bw+gap)*i;
      s += `<rect x="${x}" y="${y(b.v)}" width="${bw}" height="${pt+ih-y(b.v)}" rx="6" fill="${b.color}"/><text class="val" x="${x+bw/2}" y="${y(b.v)-7}" text-anchor="middle">${ar(b.v)}</text><text class="ax" x="${x+bw/2}" y="${H-12}" text-anchor="middle">${b.label}</text>`;
    });
    (ch.lines||[]).forEach(l => {
      s += `<line x1="${pl}" x2="${W-pr}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.color}" stroke-width="2" stroke-dasharray="6 5"/>`;
      legend += `<span style="color:${l.color}"><i class="dash"></i><span style="color:var(--ink2)">${l.label}</span></span>`;
    });
  } else {
    const n = ch.xs.length, x = i => pl + 10 + (iw-20)*(i/(n-1));
    ch.xs.forEach((lb,i) => { s += `<text class="ax" x="${x(i)}" y="${H-12}" text-anchor="middle">${lb}</text>`; });
    ch.series.forEach(se => {
      s += `<polyline fill="none" stroke="${se.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${se.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
      se.values.forEach((v,i) => { s += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="${se.color}" stroke-width="2.5"/>`; });
      const li = n-1; s += `<text class="val" x="${x(li)}" y="${y(se.values[li])-10}" text-anchor="middle" fill="${se.color}">${ar(se.values[li])}</text>`;
      legend += `<span><i style="background:${se.color}"></i>${se.name}</span>`;
    });
  }
  s += '</svg>';
  return `<figure class="chartbox"><figcaption>${ch.title}</figcaption>${s}${legend?`<div class="legend">${legend}</div>`:''}</figure>`;
}

  set(st.clientWidth*.55, st.clientHeight*.45);

function finalize(){
  const c = CASE[currentCase], p = prog(currentCase), R = c.room, rm = p.room, s = me();

  const evPts = Math.max(0, okCount - bad) * 5, explOk = !!R.explanations[rm.expl].ok, explPts = explOk ? 20 : 0;
  const skills = {};

  c.questions.forEach((q,i) => add(q.skill, p.qs[i].earned, 10));

  const wasAll = CASES.every(x => s.best[x.id]);
  if(!s.best[c.id] || score > s.best[c.id].score) s.best[c.id] = {score, max, pct, skills, date};
  const nowAll = CASES.every(x => s.best[x.id]);
  if(CASES.every(x => s.best[x.id] && s.best[x.id].pct >= 80)) give('star');
  const att = {id: Date.now().toString(36), key: skey(), name: dispName(), caseId: c.id, score, max, pct, qPts, evPts, explPts, explOk, evOk: okCount, evBad: bad, evTotal: totalOk, skills, date};

function fmtDate(iso){
  const d = new Date(iso); let h = '', g = '';
  try{ h = d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-arab', {day:'numeric', month:'long', year:'numeric'}); }catch(e){}
  try{ g = d.toLocaleDateString('ar-SA-u-ca-gregory-nu-arab', {day:'numeric', month:'long', year:'numeric'}); }catch(e){ g = d.toLocaleDateString(); }
  return {h, g};
}
function bestOf(id){
  const s = me(), b = s.best[id]; if(!b) return null;
  const p = s.progress[id];
  const skills = b.skills || (p && p.result && p.result.score === b.score ? p.result.skills : null) || {};
  const date = b.date || (p && p.result && p.result.date) || null;
  return Object.assign({}, b, {skills, date});
}
const mastered = skills => Object.entries(skills || {}).filter(([k,[e,m]]) => m && e/m >= .8).map(([k]) => SKILLS[k].name);
function grandData(){
  const list = CASES.map(c => ({c, b: bestOf(c.id)}));
  if(list.some(x => !x.b)) return null;
  const score = list.reduce((a,x) => a + x.b.score, 0), max = list.reduce((a,x) => a + x.b.max, 0);
  const agg = {};
  list.forEach(x => Object.entries(x.b.skills).forEach(([k,[e,m]]) => { if(!agg[k]) agg[k] = [0,0]; agg[k][0] += e; agg[k][1] += m; }));
  const dates = list.map(x => x.b.date).filter(Boolean).sort();
  return {list, score, max, pct: Math.round(score/max*100), skills: agg, date: dates[dates.length-1] || new Date().toISOString()};
}

      <p><b>التفسير الصحيح:</b> <span class="kans">${c.room.explanations.find(e=>e.ok).t}</span></p>
      <p class="kexp"><b>حدود الأدلة:</b> ${c.room.limits}</p>
      <p class="kexp"><b>توزيع النقاط:</b> ١٠ نقاط لكل سؤال (المحاولة الثانية حتى ٧ نقاط، وتُحتسب أعلى النتيجتين)، و٥ نقاط لكل دليل داعم يُختار مطروحًا منها الأدلة غير الداعمة دون النزول تحت الصفر، و٢٠ نقطة للتفسير الصحيح.</p>
    </details>`).join('');
  }
  else if(teacherTab === 'data'){
    body = `<div class="two">
      <div class="paper-dark"><h3>إعادة تعيين الرمز السري لطالبة</h3><p style="color:var(--muted);font-size:14.5px">إذا نسيت طالبة رمزها، اكتبي اسمها وفصلها كما سجّلتهما، ثم رمزًا جديدًا.</p>
        <form class="login" style="grid-template-columns:1fr 1fr" onsubmit="return false">
          <label style="grid-column:1 / -1"><span>اسم الطالبة</span><input id="rp-name" maxlength="40"></label>
          <label><span>الفصل</span><input id="rp-cls" maxlength="30"></label>
          <label><span>الرمز الجديد</span><input id="rp-pin" inputmode="numeric" maxlength="8"></label>
          <button class="btn btn-ghost btn-sm" data-act="t-resetpin" type="submit" style="grid-column:1 / -1">عيّني الرمز الجديد</button>
        </form></div>
      <div class="paper-dark"><h3>مسح جميع البيانات</h3><p style="color:var(--muted);font-size:14.5px">يحذف من قاعدة البيانات جميع حسابات الطالبات وتقدّمهن ونتائجهن، مثل بداية فصل دراسي جديد. لا يمكن التراجع.</p><button class="btn btn-danger" data-act="reset-all">امسحي جميع البيانات</button>
        <h3 style="margin-top:22px">الخروج من لوحة المعلمة</h3><p style="color:var(--muted);font-size:14.5px">استخدميه عند العمل على جهاز مشترك.</p><button class="btn btn-ghost btn-sm" data-act="t-logout">تسجيل خروج المعلمة</button></div>
    </div>`;
  }
  const tabs = [['results','نتائج المحاولات'],['skills','تحليل المهارات'],['key','القضايا ومفتاح الإجابة'],['data','إدارة البيانات']];
  $('#app').innerHTML = `<div class="wrap" style="padding-top:30px">
    <h1 style="font-size:32px">لوحة المعلمة</h1>
    <p style="color:var(--muted);margin-top:6px">نتائج المحاولات المكتملة، وتحليل مهارات الفهم القرائي، ومفتاح الإجابة.</p>
    <div class="notice"><b>ملاحظة:</b> تُعرض هنا نتائج الطالبات اللواتي سجّلن الدخول، من أي جهاز. المحاولات التي تتم دون تسجيل دخول تبقى على جهاز الطالبة ولا تظهر هنا.</div>
    <div class="row" style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-act="t-refresh" ${tLoading?'disabled':''}>${tLoading ? 'جارٍ التحديث…' : 'حدّثي النتائج'}</button>${tErr ? `<span style="color:var(--gold2);font-size:14.5px">${tErr}</span>` : ''}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,n]) => `<button role="tab" aria-selected="${teacherTab===k}" data-act="t-tab" data-t="${k}">${n}</button>`).join('')}</div>
    <div role="tabpanel">${body}</div>
  </div>`;
}
function keyAnswer(q){
  if(q.type === 'mcq') return 'الإجابة: ' + q.options[q.answer];
  if(q.type === 'order') return 'الترتيب: ' + q.items.map((t,i)=>`(${ar(i+1)}) ${t}`).join('، ');
  if(q.type === 'classify') return q.items.map(it => `${it.t} ← ${q.cats[it.a]}`).join('<br>');
  if(q.type === 'match') return q.items.map(it => `${it.t} ← ${q.options[it.a]}`).join('<br>');
}
function exportCSV(){
  const head = ['الطالبة','الفصل','القضية','الدرجة','الدرجة العظمى','النسبة','نقاط الأسئلة','نقاط الأدلة','نقاط التفسير','التفسير صحيح','التاريخ', ...Object.values(SKILLS).map(s=>s.name+' ٪')];
  const rows = (tData || []).map(a => [a.name||'بدون اسم', a.cls||'', CASE[a.caseId]?CASE[a.caseId].title:a.caseId, a.score, a.max, a.pct, a.qPts, a.evPts, a.explPts, a.explOk?'نعم':'لا', new Date(a.date).toLocaleString('en-GB'),
    ...Object.keys(SKILLS).map(k => a.skills && a.skills[k] && a.skills[k][1] ? Math.round(a.skills[k][0]/a.skills[k][1]*100) : '')]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = 'نتائج-محققة-العلوم.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ===================== الأحداث ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act = el.dataset.act;
  const c = currentCase ? CASE[currentCase] : null, p = currentCase ? prog(currentCase) : null;
  switch(act){
    case 'home': location.hash = '#/'; break;
    case 'start': {
      const s = me();
      const target = CASES.find(x => caseStatus(x.id).k === 'progress') || CASES.find(x => !s.best[x.id]) || CASES[0];
      location.hash = '#/case/' + target.id; break;
    }
    case 'open-case': location.hash = '#/case/' + el.dataset.id; break;
    case 'open-cert': { const pp = prog(el.dataset.id); pp.stage = 5; save(); location.hash = '#/case/' + el.dataset.id; break; }
    case 'restart-case': {
      const id = el.dataset.id;
      modal(`<h3>إعادة التحقيق في «${CASE[id].title}»</h3><p>ستبدئين القضية من جديد. أفضل نتيجة لك وسجل المحاولات السابقة يبقيان محفوظين.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-line-ink" data-act="close-modal">إلغاء</button><button class="btn btn-ink" data-act="restart-confirm" data-id="${id}">ابدئي من جديد</button></div>`);
      break;
    }
    case 'restart-confirm': { const id = el.dataset.id; me().progress[id] = newProgress(CASE[id]); save(); closeModal(); if(location.hash === '#/case/'+id) route(); else location.hash = '#/case/' + id; break; }
    case 'login': {
      const btn = el; btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
      studentLogin($('#lg-name').value, $('#lg-cls').value, $('#lg-pin').value)
        .then(() => { toast(`مرحبًا يا محققة ${DB.session.name}!`); route(); })
        .catch(err => { DB.session = null; const m = $('#gate-msg'); if(m) m.textContent = errMsg(err); else toast(errMsg(err)); btn.disabled = false; btn.textContent = 'ادخلي وابدئي التحقيق'; });
      break;
    }
    case 'logout': {
      el.disabled = true;
      pushNow().then(ok => {
        if(!ok && syncState === 'auth'){ delete DB.students[skey()]; DB.session = null; localSave(); toast('تغيّر رمزك السري، سجّلي الدخول بالرمز الجديد.'); return route(); }
        if(!ok){ el.disabled = false; return modal(`<h3>لم تُحفظ آخر التغييرات</h3><p>لا يوجد اتصال بالإنترنت الآن، لذلك لم يُرفع آخر تقدّم لك. إذا خرجتِ سيبقى محفوظًا على هذا الجهاز ويُرفع عند دخولك مرة أخرى منه.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-line-ink" data-act="close-modal">البقاء</button><button class="btn btn-ink" data-act="logout-force">اخرجي على أي حال</button></div>`); }
        delete DB.students[skey()]; DB.session = null; localSave(); toast('سُجّل خروجك. تقدّمك محفوظ ويمكنك الدخول من أي جهاز.'); location.hash = '#/'; route();
      });
      break;
    }
    case 'logout-force': DB.session = null; localSave(); closeModal(); location.hash = '#/'; route(); break;
    case 'save-name2': {
      const v = $('#nm2').value.trim(); if(!v) return toast('اكتبي الاسم أولًا.');
      setName(v);
      if(p && p.result){ const a = DB.attempts.find(x => x.id === p.result.attemptId); if(a && !a.name){ a.name = DB.current; localSave(); } }
      if(currentCase) renderCase({scroll:false}); else renderCertPage(); break;
    }
    case 'go-certs': location.hash = '#/certs'; break;
    case 'reset-me': modal(`<h3>مسح تقدّمك</h3><p>سيُمسح تقدّمك وشاراتك ونقاطك المحفوظة على هذا الجهاز دون تسجيل دخول.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-line-ink" data-act="close-modal">إلغاء</button><button class="btn btn-ink" data-act="reset-me-confirm">امسحي تقدّمي</button></div>`); break;
    case 'reset-me-confirm': delete DB.students[GUEST]; DB.attempts = DB.attempts.filter(a => a.key !== GUEST); DB.current = ''; localSave(); closeModal(); toast('مُسح تقدّمك.'); renderHome(); break;
    case 'reset-all': modal(`<h3>مسح جميع البيانات</h3><p>سيُحذف من قاعدة البيانات كل شيء: حسابات الطالبات وتقدّمهن ونتائجهن، من جميع الأجهزة. لا يمكن التراجع.</p><div class="row" style="justify-content:flex-end"><button class="btn btn-line-ink" data-act="close-modal">إلغاء</button><button class="btn btn-ink" style="background:var(--bad)" data-act="reset-all-confirm">امسحي كل البيانات</button></div>`); break;
    case 'reset-all-confirm':
      closeModal();
      rpc('mq_teacher_reset', {p_pin:tPin}).then(() => { tData = []; toast('مُسحت جميع البيانات.'); renderTeacher(); }).catch(err => toast(errMsg(err)));
      break;
    case 't-login': {
      const v = toEn($('#tp').value); if(!v) return toast('اكتبي رمز المعلمة.');
      tPin = v; tData = null; tErr = '';
      try{ sessionStorage.setItem('mq-tpin', v); }catch(_){}
      loadTeacher(); break;
    }
    case 't-refresh': loadTeacher(); break;
    case 't-logout': tPin = ''; tData = null; tErr = ''; try{ sessionStorage.removeItem('mq-tpin'); }catch(_){} renderTeacher(); break;
    case 't-resetpin': {
      const n = norm($('#rp-name').value), c = toEn(norm($('#rp-cls').value)), np = toEn($('#rp-pin').value);
      if(!n) return toast('اكتبي اسم الطالبة.');
      if(!/^[0-9]{4,8}$/.test(np)) return toast(ERR.invalid_pin);
      rpc('mq_teacher_reset_pin', {p_name:n, p_class:c, p_teacher_pin:tPin, p_new_pin:np})
        .then(() => { toast(`عُيّن الرمز الجديد للطالبة ${n}.`); $('#rp-pin').value = ''; })
        .catch(err => toast(errMsg(err)));
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'term': {
      const t = el.dataset.term, def = (c && c.glossary[t]) || CASES.map(x=>x.glossary[t]).find(Boolean) || '';
      modal(`<h3>📘 ${esc(t)}</h3><p>${def}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ink btn-sm" data-act="close-modal">فهمت</button></div>`); break;
    }
    case 'go-stage': { const s = +el.dataset.s; if(s <= p.maxStage){ p.stage = s; if(s===2){ const f = firstUndone(p); if(f < p.qs.length) p.qi = f; } save(); renderCase(); } break; }
    case 'next-stage': goStage(p, +el.dataset.s); renderCase(); break;
    case 'go-q': p.qi = +el.dataset.i; save(); renderCase({scroll:false}); $('.qtop') && $('.stage').scrollIntoView({block:'start', behavior: REDUCED?'auto':'smooth'}); break;
    case 'mcq-pick': { const st = p.qs[p.qi]; if(st.done) break; st.sel = +el.dataset.k; save(); renderCase({scroll:false}); break; }
    case 'ord-move': {
      const st = p.qs[p.qi]; if(st.done) break;
      const pos = +el.dataset.pos, d = +el.dataset.d, to = pos + d;
      if(to < 0 || to >= st.sel.length) break;
      [st.sel[pos], st.sel[to]] = [st.sel[to], st.sel[pos]]; st.marks = null; save(); renderCase({scroll:false});
      const btn = document.querySelector(`[data-act="ord-move"][data-pos="${to}"][data-d="${d}"]`) || document.querySelector(`[data-act="ord-move"][data-pos="${to}"]`); if(btn) btn.focus();
      break;
    }
    case 'cls-pick': { const st = p.qs[p.qi]; if(st.done) break; const k = +el.dataset.k; st.sel[k] = +el.dataset.c; if(st.marks) st.marks[k] = null; save(); renderCase({scroll:false}); const b = document.querySelector(`[data-act="cls-pick"][data-k="${k}"][data-c="${el.dataset.c}"]`); if(b) b.focus(); break; }
    case 'q-check': checkQ(); break;
    case 'ev-toggle': { const k = +el.dataset.k, i = p.room.sel.indexOf(k); if(i < 0) p.room.sel.push(k); else p.room.sel.splice(i,1); save(); renderCase({scroll:false}); const b = document.querySelector(`[data-act="ev-toggle"][data-k="${k}"]`); if(b) b.focus(); break; }
    case 'expl-pick': p.room.expl = +el.dataset.k; save(); renderCase({scroll:false}); { const b = document.querySelector(`[data-act="expl-pick"][data-k="${el.dataset.k}"]`); if(b) b.focus(); } break;
    case 'room-lock': modal(`<h3>تثبيت القرار النهائي</h3><p>اخترتِ ${ar(p.room.sel.length)} ${p.room.sel.length===1?'دليلًا':'أدلة'} وتفسيرًا واحدًا. بعد التثبيت لا يمكن تغيير القرار في هذه المحاولة. هل راجعتِ ملف الأدلة؟</p><div class="row" style="justify-content:flex-end"><button class="btn btn-line-ink" data-act="review-first">أريد المراجعة أولًا</button><button class="btn btn-ink" data-act="room-confirm">نعم، ثبّتي القرار</button></div>`); break;
    case 'review-first': closeModal(); openDrawer(); break;
    case 'room-confirm': closeModal(); finalize(); renderCase(); break;
    case 'open-drawer': openDrawer(el.dataset.ref); break;
    case 'close-drawer': closeDrawer(); break;
    case 'print': fillPrint(); window.print(); break;
    case 't-tab': teacherTab = el.dataset.t; renderTeacher(); break;
    case 'export-csv': exportCSV(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.act === 'match'){ const p = prog(currentCase), st = p.qs[p.qi]; if(st.done) return; const k = +el.dataset.k; st.sel[k] = el.value === '' ? null : +el.value; if(st.marks) st.marks[k] = null; save(); renderCase({scroll:false}); const s = document.querySelector(`select[data-k="${k}"]`); if(s) s.focus(); }
  if(el.dataset.act === 't-filter'){ teacherFilter = el.value; renderTeacher(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!$('#modal').hidden) closeModal(); else closeDrawer(); }
});
window.addEventListener('storage', e => { if(e.key === KEY){ DB = loadDB(); route(); } });

route();
</script>
